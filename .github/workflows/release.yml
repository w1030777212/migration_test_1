name: Bytebase Release demo - create plan only
run-name: Release demo ${{ inputs.release_set }} - create plan

on:
  workflow_dispatch:
    inputs:
      release_set:
        description: "A: first 3; B: first 4; C: mutex wait 90 seconds"
        required: true
        type: choice
        default: A
        options:
          - A
          - B
          - C

permissions:
  contents: read

env:
  BYTEBASE_URL: https://cloud.bytebase.com
  BYTEBASE_WORKLOAD_IDENTITY: release-demo-20261015@gha-wdhk.workload.bytebase.com
  BYTEBASE_PROJECT: projects/gha-wdhk
  BYTEBASE_RELEASE_SET: ${{ inputs.release_set }}
  BYTEBASE_FILE_PATTERN: ${{ inputs.release_set == 'A' && 'migrations/2026101400000[1-3]*.sql' || inputs.release_set == 'B' && 'migrations/2026101400000[1-4]*.sql' || 'migrations/*.sql' }}

jobs:
  create-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    container:
      image: bytebase/bytebase-action:cloud
    steps:
      - uses: actions/checkout@v4
      - name: Exchange GitHub OIDC token
        id: bytebase-auth
        shell: sh
        run: |
          set -eu
          BB_OIDC_RESPONSE=$(mktemp)
          BB_EXCHANGE_RESPONSE=$(mktemp)
          trap 'rm -f "$BB_OIDC_RESPONSE" "$BB_EXCHANGE_RESPONSE"' EXIT
          BB_OIDC_STATUS=$(curl -sS -o "$BB_OIDC_RESPONSE" -w '%{http_code}' \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=bytebase")
          echo "GitHub OIDC HTTP $BB_OIDC_STATUS"
          if [ "$BB_OIDC_STATUS" != "200" ]; then
            jq -r '.message // "GitHub OIDC request failed"' "$BB_OIDC_RESPONSE"
            exit 1
          fi
          OIDC_TOKEN=$(jq -er '.value' "$BB_OIDC_RESPONSE")
          echo "::add-mask::$OIDC_TOKEN"
          printf '%s' "$OIDC_TOKEN" | jq -R 'split(".")[1] | gsub("-";"+") | gsub("_";"/") | @base64d | fromjson | {iss,aud,sub,repository,ref}'
          BB_EXCHANGE_STATUS=$(curl -sS -o "$BB_EXCHANGE_RESPONSE" -w '%{http_code}' \
            -X POST "$BYTEBASE_URL/v1/auth:exchangeToken" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg token "$OIDC_TOKEN" --arg email "$BYTEBASE_WORKLOAD_IDENTITY" '{token:$token,email:$email}')")
          echo "Bytebase token exchange HTTP $BB_EXCHANGE_STATUS"
          if [ "$BB_EXCHANGE_STATUS" != "200" ]; then
            jq -r --arg token "$OIDC_TOKEN" '(.message // "Bytebase token exchange failed") | tostring | split($token) | join("[REDACTED]")' "$BB_EXCHANGE_RESPONSE"
            exit 1
          fi
          ACCESS_TOKEN=$(jq -er '.accessToken' "$BB_EXCHANGE_RESPONSE")
          echo "::add-mask::$ACCESS_TOKEN"
          echo "access-token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"
      - name: Check release SQL
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: sh
        run: |
          set -eu
          bytebase-action check \
            --url="$BYTEBASE_URL" \
            --access-token="${{ steps.bytebase-auth.outputs.access-token }}" \
            --project="$BYTEBASE_PROJECT" \
            --targets=projects/gha-wdhk/instances/sample-d3ecb82fcfd87e08/databases/bb_sample_c2c0430cc93711a1 \
            --file-pattern="$BYTEBASE_FILE_PATTERN" \
            --check-release=FAIL_ON_ERROR
      - name: Create release and plan
        shell: sh
        run: |
          set -eu
          bytebase-action rollout \
            --url="$BYTEBASE_URL" \
            --access-token="${{ steps.bytebase-auth.outputs.access-token }}" \
            --project="$BYTEBASE_PROJECT" \
            --targets=projects/gha-wdhk/instances/sample-d3ecb82fcfd87e08/databases/bb_sample_c2c0430cc93711a1 \
            --file-pattern="$BYTEBASE_FILE_PATTERN" \
            --release-id-template="demo_${BYTEBASE_RELEASE_SET}_{date}-RC{iteration}" \
            --output="${{ runner.temp }}/bytebase-metadata.json"
      - name: Show plan link
        shell: sh
        run: |
          set -eu
          PLAN=$(jq -er '.plan' "${{ runner.temp }}/bytebase-metadata.json")
          PLAN_ID=${PLAN##*/}
          echo "### Bytebase plan" >> "$GITHUB_STEP_SUMMARY"
          echo "[$PLAN]($BYTEBASE_URL/$BYTEBASE_PROJECT/plans/$PLAN_ID)" >> "$GITHUB_STEP_SUMMARY"
